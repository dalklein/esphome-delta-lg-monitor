# ============================================================================
# Delta inverter monitor — '485' PORT ONLY, SINGLE PV STRING (PV1).
#
# delta-pv-only.yaml with the PV2 string removed as well. Use this when only
# MPPT1 has panels on it.
#
# 🔑 WHY THIS EXISTS: an UNCONNECTED string does not necessarily read zero.
#    Non-zero values have been seen on an unused input in Delta's own phone app,
#    and pv_total_w adds PV1 + PV2 - so polling a string that is not there can
#    corrupt the total continuously, not just occasionally. With one string,
#    do not poll the second.
#
# ✅ The '485' side is TESTED — E-series 2026-09-20, and confirmed in the field on an
#    M(4/6/8/10)-TL-US 2026-09-23: the port answers at 38400, address 1.
#    ⚠️ The M-series has NO RGM BUS — the green terminal block is not populated — so
#    there is no battery and no revenue meter, and this port is all you get.
#    ⚠️ Reporter saw implausible SOLIVIA spikes and moved to delta-pv-only-sunspec.yaml.
#
#   ESP32-WROOM-32 (esp32dev, esp-idf)
#   UART1  GPIO18 TX / GPIO19 RX -> Delta '485', 38400 8N1, Delta is server addr 1
#          RJ45 pin 7 = A+, pin 8 = B-
#   GPIO17 unused. Only ONE RS485-TTL module is needed.
#
# pv_total_w is still published and equals PV1, so a dashboard built against the
# two-string config keeps working unchanged.
#
# MQTT topics are set per entity (delta/485/...), as are birth/will/log, because
# ESPHome's topic_prefix is per-device.
#
# NO DATA? The '485' port has no client until this board becomes one, so silence is
# the symptom of every mistake. Check delta/485/status = online, swap A+/B-, confirm
# Modbus address 1 - then suspect the model.
# ==============================================================================

esphome:
  # 🔴 2026.3.0 is the first release with the modbus hub's `turnaround_time`, which is
  # what supplies the >=95 ms bus spacing these devices need. On anything older that
  # option does not exist and `command_throttle` defaults to 0ms, so the '485' bus is
  # polled unspaced: it builds, flashes and runs, and drops replies intermittently.
  # Verified on 2026.2.0 - it validates clean and resolves to command_throttle: 0ms.
  min_version: 2026.3.0
  # The name sets the mDNS/OTA hostname and the MQTT client id. It does NOT affect
  # the MQTT topics, which are set explicitly on every entity below.
  name: delta-pv1-only
  friendly_name: Delta PV1 Only Monitor

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 0          # free UART0; logs go over WiFi/MQTT

wifi:
  networks:
    - ssid: !secret wifi_ssid_g
      password: !secret wifi_password
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: "Delta Inverter Fallback"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_broker_ip
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: "delta"
  birth_message:
    topic: "delta/485/status"
    payload: "online"
  will_message:
    topic: "delta/485/status"
    payload: "offline"
  log_topic:
    topic: "delta/485/debug"
  on_disconnect:
    - logger.log: "MQTT broker unavailable, continuing to poll."
  on_message:
    - topic: "delta/485/cmd/poll"
      then:
        - lambda: |-
            if (x == "off") id(sw_485_poll).turn_off();
            else if (x == "on") id(sw_485_poll).turn_on();

external_components:
  - source:
      type: local
      path: components
    components: [solivia]      # ships with this repo

# ---------------------------------------------------------------------------
# The Delta's own '485' port.  RJ45 pin 7 = A+, pin 8 = B-.  38400 8N1 (NOT 9600
# like the RGM bus on the full two-bus config).
#
# ⚠️ Declare this uart even if you do not poll the port. The RS485 module's driver
# input sits on GPIO18; with no uart declaring that pin it floats, which can
# spuriously enable the transmitter onto a live bus. Declaring it drives the pin
# to UART idle and holds the module in receive.
uart:
  - id: uart_485
    tx_pin: GPIO18
    rx_pin: GPIO19
    baud_rate: 38400
    stop_bits: 1
    data_bits: 8
    parity: NONE
    rx_buffer_size: 512

# ---------------------------------------------------------------------------
# NO RGM UART HERE, and that is safe — but not for the reason above.
# GPIO18 DRIVES the '485' module's DI, so it stays declared even when unpolled: an
# undriven DI can float and key the transmitter onto a live bus. GPIO17 only
# RECEIVES, and no ESP pin is CONFIGURED to reach the RGM module's DI, so leaving it
# unconfigured risks nothing. Confirmed by the owner 2026-09-19 that the pin is
# physically unconnected on that board — re-check if yours is wired differently.
# Two same-looking uart blocks, opposite hazards.

# ===========================================================================
# '485' PORT CLIENT — the Delta's own SunSpec/Modbus-RTU server port (addr 1)
#
# Stock ESPHome modbus + modbus_controller: this half of the dashboard is plain
# Modbus RTU FC03, so there is no reason to hand-roll it.
#
# 🔴 READ ONLY. Only `sensor` platforms are declared — no number/output/switch —
#    so nothing here can write to the inverter.
# 🔑 BUS SPACING is not set here. These devices need >=95 ms between requests or
#    they start dropping replies. That floor comes from the `modbus` hub's
#    `turnaround_time`, which DEFAULTS TO 600 ms — ample, and measured 2026-09-19 to
#    still let all 45 '485' sensors meet their update_interval. This variant now polls
#    fewer than that (the battery registers are dropped - no battery here), so it asks
#    strictly less of the same hub.
#    ⚠️ `command_throttle` on the controller is INERT since 2026.8 and removed in
#    2027.2.0. To tighten, set `turnaround_time` on the hub — never below 95 ms.
# ⚠️ SunSpec values come with a separate SCALE FACTOR register (an int16 power of
#    ten). Both the raw value AND its SF are published, so the consumer applies the
#    scaling. The SFs are deliberately not assumed here.
# ===========================================================================
modbus:
  - id: mb485
    uart_id: uart_485
    role: client

modbus_controller:
  - id: delta485
    address: 1
    modbus_id: mb485
    update_interval: 10s
    setup_priority: -10

# Loop-time diagnostic. debug's loop_time reports the MAXIMUM iteration since the last
# update, not an average -- the tail is what matters on a board doing several jobs.
# Useful for seeing whether a polling component is blocking the loop.
debug:
  update_interval: 1s

sensor:
  - platform: debug
    loop_time:
      name: "485 Loop Time"
      id: loop_time_485
      state_topic: "delta/485/sensor/loop_time/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta ac current"
    id: d485_ac_a_raw
    on_value:
      then:
        - lambda: |-
            if (!isnan(id(d485_ac_a_sf).state))
              id(d485_ac_a).publish_state(x * powf(10.0f, id(d485_ac_a_sf).state));
    address: 40071
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/ac_a_raw/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta ac current sf"
    id: d485_ac_a_sf
    address: 40075
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/ac_a_sf/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta voltage L1-L2"
    id: d485_v_l1l2_raw
    address: 40076
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/v_l1l2_raw/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta voltage L1"
    id: d485_v_l1_raw
    address: 40079
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/v_l1_raw/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta voltage L2"
    id: d485_v_l2_raw
    address: 40080
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/v_l2_raw/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta voltage sf"
    id: d485_v_sf
    address: 40082
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/v_sf/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta ac power"
    id: d485_ac_w_raw
    address: 40083
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/ac_w_raw/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta ac power sf"
    id: d485_ac_w_sf
    address: 40084
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/ac_w_sf/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta frequency"
    id: d485_hz_raw
    on_value:
      then:
        - lambda: |-
            if (!isnan(id(d485_hz_sf).state))
              id(d485_hz).publish_state(x * powf(10.0f, id(d485_hz_sf).state));
    address: 40085
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/hz_raw/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta frequency sf"
    id: d485_hz_sf
    address: 40086
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/hz_sf/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta apparent power"
    id: d485_va_raw
    address: 40087
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/va_raw/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta apparent power sf"
    id: d485_va_sf
    address: 40088
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/va_sf/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta reactive power"
    id: d485_var_raw
    address: 40089
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/var_raw/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta reactive power sf"
    id: d485_var_sf
    address: 40090
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/var_sf/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta power factor"
    id: d485_pf_raw
    on_value:
      then:
        - lambda: |-
            if (!isnan(id(d485_pf_sf).state))
              id(d485_pf).publish_state(x * powf(10.0f, id(d485_pf_sf).state));
    address: 40091
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/pf_raw/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta power factor sf"
    id: d485_pf_sf
    address: 40092
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/pf_sf/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta heatsink temp"
    id: d485_temp_raw
    on_value:
      then:
        - lambda: |-
            if (!isnan(id(d485_temp_sf).state))
              id(d485_temp).publish_state(x * powf(10.0f, id(d485_temp_sf).state));
    address: 40102
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/temp_raw/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta temp sf"
    id: d485_temp_sf
    address: 40106
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/temp_sf/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta meter power"
    id: d485_meter_w
    address: 49991
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/meter_w/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta lifetime energy"
    id: d485_wh_total
    on_value:
      then:
        - lambda: |-
            if (!isnan(id(d485_wh_sf).state))
              id(d485_wh_kwh).publish_state(x * powf(10.0f, id(d485_wh_sf).state) / 1000.0f);
    address: 40093
    register_type: holding
    value_type: U_DWORD
    state_topic: "delta/485/sensor/wh_total_raw/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta lifetime energy sf"
    id: d485_wh_sf
    address: 40095
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/wh_total_sf/state"

  # 1=off 2=sleeping 3=starting 4=MPPT running 5=throttled
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta inverter state"
    id: d485_state
    address: 40107
    register_type: holding
    value_type: U_WORD
    state_topic: "delta/485/sensor/state/state"
  # SunSpec Evt1 low word
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta event flags lo"
    id: d485_evt1_lo
    address: 40109
    register_type: holding
    value_type: U_WORD
    state_topic: "delta/485/sensor/evt1_lo/state"
  # SunSpec Evt1 high word
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta event flags hi"
    id: d485_evt1_hi
    address: 40110
    register_type: holding
    value_type: U_WORD
    state_topic: "delta/485/sensor/evt1_hi/state"
  # SIGNED watts, scale 1:1. Positive = charging, negative = discharging.
  - platform: solivia
    solivia_id: sol485
    name: "delta pv1 voltage"
    id: sol_pv1_v
    cmd: 111
    sub: 1
    divisor: 10.0
    accuracy_decimals: 1   # ESPHome defaults to 0 when unset, which rounded every value to a whole number
    state_topic: "delta/485/sensor/pv1_v/state"
    # Plausibility gate. Rare misaligned reads return a CRC-VALID frame whose
    # payload parses at the wrong offset - low byte 0x00, high byte 0xE4-0xF8,
    # e.g. raw 63488 -> 6348.8 V. Seen 4 times in 83,416 points on the E6 and far
    # more often elsewhere. NAN is dropped, so a bad sample leaves a gap, not a spike.
    filters:
      - lambda: |-
          if (x > 600.0f) return {};   // {} = drop the sample; NAN would PUBLISH NaN
          return x;                 // V  - no PV string on this inverter class reaches 600 V
  - platform: solivia
    solivia_id: sol485
    name: "delta pv1 current"
    id: sol_pv1_a
    on_value:
      then:
        - lambda: |-
            // One string, so the total IS PV1. pv_total_w is kept so a dashboard
            // built against the two-string config needs no change.
            if (!isnan(id(sol_pv1_v).state)) {
              float p1 = id(sol_pv1_v).state * x;
              id(pv1_w).publish_state(p1);
              id(pv_total_w).publish_state(p1);
            }
    cmd: 111
    sub: 2
    divisor: 100.0
    accuracy_decimals: 2   # ESPHome defaults to 0 when unset, which rounded every value to a whole number
    state_topic: "delta/485/sensor/pv1_a/state"
    # Plausibility gate. Rare misaligned reads return a CRC-VALID frame whose
    # payload parses at the wrong offset - low byte 0x00, high byte 0xE4-0xF8,
    # e.g. raw 63488 -> 6348.8 V. Seen 4 times in 83,416 points on the E6 and far
    # more often elsewhere. NAN is dropped, so a bad sample leaves a gap, not a spike.
    filters:
      - lambda: |-
          if (x > 20.0f) return {};   // {} = drop the sample; NAN would PUBLISH NaN
          return x;                 // A  - comfortably above any string Isc here
  - platform: solivia
    solivia_id: sol485
    name: "delta dc bus voltage"
    id: sol_dcbus_v
    cmd: 111
    sub: 31
    divisor: 10.0
    accuracy_decimals: 1   # ESPHome defaults to 0 when unset, which rounded every value to a whole number
    state_topic: "delta/485/sensor/dcbus_v/state"
    # Plausibility gate. Rare misaligned reads return a CRC-VALID frame whose
    # payload parses at the wrong offset - low byte 0x00, high byte 0xE4-0xF8,
    # e.g. raw 63488 -> 6348.8 V. Seen 4 times in 83,416 points on the E6 and far
    # more often elsewhere. NAN is dropped, so a bad sample leaves a gap, not a spike.
    filters:
      - lambda: |-
          if (x > 600.0f) return {};   // {} = drop the sample; NAN would PUBLISH NaN
          return x;                 // V  - the DC bus runs 400-450 V
  # --- DERIVED PV POWER --------------------------------------------------
  # There is NO PV power register and NO PV energy counter on this inverter
  # (SunSpec model 160 is not implemented; the vendor block has none either).
  # Computed here rather than in Node-RED so consumers get ONE topic instead of
  # having to join two topics that arrive ~2 s apart on the SOLIVIA cycle.
  # isnan() guard: the source sensors are NaN until their first poll completes.
  - platform: template
    name: "delta pv1 power"
    id: pv1_w
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 1
    update_interval: never      # published by sol_pv1_a's on_value - see below
    state_topic: "delta/485/sensor/pv1_w/state"
  - platform: template
    name: "delta pv total power"
    id: pv_total_w
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 1
    update_interval: never      # published by sol_pv1_a's on_value - see below
    state_topic: "delta/485/sensor/pv_total_w/state"

  # SOLIVIA also reports grid frequency, but it is deliberately not polled here: SunSpec
  # already gives it as hz_raw/hz_sf in a poll that happens anyway, so the SOLIVIA copy is
  # pure extra '485' traffic. The two agreed when compared (59.97 vs 59.99).

# ===========================================================================
# BUS-SHARING HOOK for the '485' port
#
# Only ONE client may drive a bus. To let another client (or anything else) explore
# the '485' port, STOP this board polling first:
#
#     mosquitto_pub -t delta/485/cmd/poll -m off     # release the bus
#     mosquitto_pub -t delta/485/cmd/poll -m on      # take it back
#
# modbus_controller is a PollingComponent, so stop_poller() halts it cleanly at
# a transaction boundary - no half-finished exchange left on the wire. State is
# echoed on delta/485/status/poll so a script can confirm the bus is free
# before transmitting.
# ===========================================================================
# SOLIVIA: the Delta's second protocol on the '485' port. Carries the per-string PV data
# and DC-bus/grid values that SunSpec does not expose. Read-only by construction.

# ---------------------------------------------------------------------------
# SCALED SunSpec values, computed LIVE from each value's own scale factor.
#
# The *_raw and *_sf sensors above are published untouched and stay the source
# of truth. These apply raw x 10^SF at the moment the pair was sampled, rather
# than baking in a constant: the sweep of 2026-09-05 saw every SF hold steady
# (distinct=1), but the METER's W_SF on the RGM bus is known to switch with
# magnitude, so an exponent that looks fixed is not proof that it is.
# Today these resolve to A /10, Hz /100, PF /1000, temp /10.
# ---------------------------------------------------------------------------
  - platform: template
    name: "delta ac current scaled"
    id: d485_ac_a
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 2
    update_interval: never      # published by d485_ac_a_raw's on_value
    state_topic: "delta/485/sensor/ac_a/state"
  - platform: template
    name: "delta frequency scaled"
    id: d485_hz
    unit_of_measurement: "Hz"
    device_class: frequency
    accuracy_decimals: 2
    update_interval: never      # published by d485_hz_raw's on_value
    state_topic: "delta/485/sensor/hz/state"
  - platform: template
    name: "delta power factor scaled"
    id: d485_pf
    device_class: power_factor
    accuracy_decimals: 3
    update_interval: never      # published by d485_pf_raw's on_value
    state_topic: "delta/485/sensor/pf/state"
  - platform: template
    name: "delta heatsink temp scaled"
    id: d485_temp
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never      # published by d485_temp_raw's on_value
    state_topic: "delta/485/sensor/temp/state"
  - platform: template
    name: "delta lifetime energy kWh"
    id: d485_wh_kwh
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: never      # published by d485_wh_total's on_value
    state_topic: "delta/485/sensor/lifetime_kwh/state"
    # 40093+40094 read as one U_DWORD, x 10^WH_SF (40095), then /1000.
    # This is AC energy delivered, NOT PV harvest: the inverter exposes no
    # PV total at all - no SunSpec MPPT model, and the DC block is MPPT1 only.

solivia:
  id: sol485
  uart_id: uart_485
  address: 1
  # burst: 2 sends two requests ~100 ms apart, then waits update_interval. That keeps
  # each V/A PAIR sampled close together, which matters because V x A is multiplied
  # below -- sampling them 2 s apart smears the derived power across a changing load.
  # ⚠️ The pairing comes from SENSOR DECLARATION ORDER above, nothing else:
  #        pv1_v,pv1_a | dcbus_v     (3 items: the pair never splits)
  # Reordering or inserting a sensor re-pairs them silently. Re-check if you edit.
  # Bus cost is 0.5 requests/s; with 3 items each value refreshes every 8 s.
  burst: 2
  update_interval: 4s

switch:
  - platform: template
    name: "delta 485 polling"
    id: sw_485_poll
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(delta485)->start_poller();
          id(sol485)->start_poller();
          ESP_LOGI("bus485", "polling ENABLED - this board owns the '485' bus");
      - mqtt.publish:
          topic: "delta/485/status/poll"
          payload: "on"
          retain: true
    turn_off_action:
      - lambda: |-
          id(delta485)->stop_poller();
          id(sol485)->stop_poller();
          ESP_LOGI("bus485", "polling DISABLED - '485' bus released for another client");
      - mqtt.publish:
          topic: "delta/485/status/poll"
          payload: "off"
          retain: true

