  # Wh
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta battery energy A"
    id: d485_batt_wh_a
    address: 50087
    register_type: holding
    value_type: U_WORD
    state_topic: "delta/485/sensor/batt_wh_a/state"
  # purpose not yet identified
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta batt block 50090"
    id: d485_b50090
    address: 50090
    register_type: holding
    value_type: U_WORD
    state_topic: "delta/485/sensor/b50090/state"
  # purpose not yet identified
  - platform: modbus_controller
