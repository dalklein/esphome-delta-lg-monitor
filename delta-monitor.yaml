    name: "delta batt block 50107"
    id: d485_b50107
    address: 50107
    register_type: holding
    value_type: U_WORD
    state_topic: "delta/485/sensor/b50107/state"
  # purpose not yet identified
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta batt block 50116"
    id: d485_b50116
    address: 50116
    register_type: holding
    value_type: U_WORD
    state_topic: "delta/485/sensor/b50116/state"

  # --- SOLIVIA values (cmd 111), the half SunSpec cannot reach ---
  - platform: solivia
    solivia_id: sol485
    name: "delta pv1 voltage"
    id: sol_pv1_v
    cmd: 111
    sub: 1
    divisor: 10.0
    accuracy_decimals: 1   # ESPHome defaults to 0 when unset, which rounded every value to a whole number
    state_topic: "delta/485/sensor/pv1_v/state"
  - platform: solivia
    solivia_id: sol485
    name: "delta pv1 current"
    id: sol_pv1_a
    on_value:
      then:
        - lambda: |-
            if (!isnan(id(sol_pv1_v).state))
              id(pv1_w).publish_state(id(sol_pv1_v).state * x);
    cmd: 111
    sub: 2
    divisor: 100.0
    accuracy_decimals: 2   # ESPHome defaults to 0 when unset, which rounded every value to a whole number
    state_topic: "delta/485/sensor/pv1_a/state"
  - platform: solivia
    solivia_id: sol485
    name: "delta pv2 voltage"
    id: sol_pv2_v
    cmd: 111
    sub: 11
    divisor: 10.0
    accuracy_decimals: 1   # ESPHome defaults to 0 when unset, which rounded every value to a whole number
    state_topic: "delta/485/sensor/pv2_v/state"
  - platform: solivia
    solivia_id: sol485
    name: "delta pv2 current"
    id: sol_pv2_a
    on_value:
      then:
        - lambda: |-
            if (!isnan(id(sol_pv2_v).state)) {
              float p2 = id(sol_pv2_v).state * x;
              id(pv2_w).publish_state(p2);
              if (!isnan(id(pv1_w).state))
                id(pv_total_w).publish_state(id(pv1_w).state + p2);
            }
    cmd: 111
    sub: 12
    divisor: 100.0
    accuracy_decimals: 2   # ESPHome defaults to 0 when unset, which rounded every value to a whole number
    state_topic: "delta/485/sensor/pv2_a/state"
  - platform: solivia
    solivia_id: sol485
    name: "delta dc bus voltage"
    id: sol_dcbus_v
    cmd: 111
    sub: 31
    divisor: 10.0
    accuracy_decimals: 1   # ESPHome defaults to 0 when unset, which rounded every value to a whole number
    state_topic: "delta/485/sensor/dcbus_v/state"
  # --- DERIVED PV POWER --------------------------------------------------
  # There is NO PV power register and NO PV energy counter on this inverter
  # (SunSpec model 160 is not implemented; the vendor block has none either).
  # Computed here rather than in Node-RED so consumers get ONE topic instead of
  # having to join two topics that arrive ~2 s apart on the SOLIVIA cycle.
  # isnan() guard: the source sensors are NaN until their first poll completes.
  - platform: template
    name: "delta pv1 power"
    id: pv1_w
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 1
    update_interval: never      # published by sol_pv1_a's on_value - see below
    state_topic: "delta/485/sensor/pv1_w/state"
  - platform: template
    name: "delta pv2 power"
    id: pv2_w
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 1
    update_interval: never      # published by sol_pv2_a's on_value - see below
    state_topic: "delta/485/sensor/pv2_w/state"
  - platform: template
    name: "delta pv total power"
    id: pv_total_w
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 1
    update_interval: never      # published by sol_pv2_a's on_value - see below
    state_topic: "delta/485/sensor/pv_total_w/state"

  # SOLIVIA also reports grid frequency, but it is deliberately not polled here: SunSpec
  # already gives it as hz_raw/hz_sf in a poll that happens anyway, so the SOLIVIA copy is
  # pure extra '485' traffic. The two agreed when compared (59.97 vs 59.99).
  - platform: modbus_rtu_sniffer
    modbus_rtu_sniffer_id: sniff
    address: 0x0F
    register: 102
    value_type: S_WORD
    name: "lg 102"
    id: lg_102
    state_topic: "delta/rgm/sensor/lg_102/state"
  - platform: modbus_rtu_sniffer
    modbus_rtu_sniffer_id: sniff
    address: 0x0F
    register: 103
    value_type: S_WORD
    name: "lg 103"
    id: lg_103
    state_topic: "delta/rgm/sensor/lg_103/state"
  - platform: modbus_rtu_sniffer
    modbus_rtu_sniffer_id: sniff
    address: 0x0F
    register: 110
    value_type: S_WORD
    name: "lg 110"
    id: lg_110
    state_topic: "delta/rgm/sensor/lg_110/state"
  - platform: modbus_rtu_sniffer
    modbus_rtu_sniffer_id: sniff
    address: 0x0F
    register: 111
    value_type: S_WORD
    name: "lg 111"
    id: lg_111
    state_topic: "delta/rgm/sensor/lg_111/state"
  - platform: modbus_rtu_sniffer
    modbus_rtu_sniffer_id: sniff
    address: 0x0F
    register: 112
    value_type: S_WORD
    name: "lg 112"
    id: lg_112
    state_topic: "delta/rgm/sensor/lg_112/state"
  - platform: modbus_rtu_sniffer
    modbus_rtu_sniffer_id: sniff
    address: 0x0F
    register: 113
    value_type: S_WORD
    name: "lg 113"
    id: lg_113
    state_topic: "delta/rgm/sensor/lg_113/state"
  - platform: modbus_rtu_sniffer
    modbus_rtu_sniffer_id: sniff
    address: 0x0F
    register: 114
    value_type: S_WORD
    name: "lg 114"
    id: lg_114
    state_topic: "delta/rgm/sensor/lg_114/state"
  - platform: modbus_rtu_sniffer
    modbus_rtu_sniffer_id: sniff
    address: 0x0F
    register: 115
    value_type: S_WORD
    name: "lg 115"
    id: lg_115
    state_topic: "delta/rgm/sensor/lg_115/state"
  - platform: modbus_rtu_sniffer
    modbus_rtu_sniffer_id: sniff
    address: 0x0F
    register: 116
    value_type: U_WORD
    name: "lg 116"
    id: lg_116
    state_topic: "delta/rgm/sensor/lg_116/state"
  - platform: modbus_rtu_sniffer
    modbus_rtu_sniffer_id: sniff
    address: 0x0F
    register: 117
    value_type: S_WORD
    name: "lg 117"
    id: lg_117
    state_topic: "delta/rgm/sensor/lg_117/state"
