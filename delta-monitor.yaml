# ============================================================================
# Delta E-series inverter + LG RESU10H-Prime monitor, one ESP32, two RS485 buses.
#
#   ESP32-WROOM-32, board esp32dev, framework esp-idf
#
#   UART2 / GPIO17  RGM bus,   9600 8N1   RECEIVE ONLY
#                   No tx_pin and no TX buffer are declared, so this firmware
#                   physically cannot transmit onto the bus the inverter masters.
#   UART1 / GPIO18 TX, GPIO19 RX
#                   the Delta's own '485' port, 38400 8N1, Delta is the slave
#                   at address 1. This board masters it.
#
# MQTT TOPICS are set explicitly on every entity, because one device serves both
# roles and ESPHome's topic_prefix is per-device:
#     delta/rgm/...   the RGM bus sniffer (battery)
#     delta/485/...   the Delta's own port (inverter telemetry)
# Birth, will and log topics are set explicitly too, or they would land on a bare
# "delta/status".
# ============================================================================

esphome:
  # The name sets the mDNS/OTA hostname and the MQTT client id. It does NOT affect
  # the MQTT topics, which are set explicitly on every entity below.
  name: delta-monitor
  friendly_name: Delta + LG RESU Monitor

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 0          # free UART0; logs go over WiFi/MQTT

wifi:
  networks:
    - ssid: !secret wifi_ssid_g
      password: !secret wifi_password
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: "Delta RGM Sniff Fallback"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_broker_ip
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: "delta"
  birth_message:
    topic: "delta/rgm/status"
    payload: "online"
  will_message:
    topic: "delta/rgm/status"
    payload: "offline"
  log_topic:
    topic: "delta/rgm/debug"
  on_disconnect:
    - logger.log: "MQTT broker unavailable, continuing to sniff."
  on_message:
    - topic: "delta/485/cmd/poll"
      then:
        - lambda: |-
            if (x == "off") id(sw_485_poll).turn_off();
            else if (x == "on") id(sw_485_poll).turn_on();

external_components:
  # 🔑 PINNED. Without a `ref:` this tracks the component repo's default branch, so any
  # push there lands here on the next build once the ~1 day cache expires -- an upstream
  # change arriving with no action on your part, in a config that flashes a live device.
  # Pin to a tag and move it deliberately. ESPHome keys its cache by (url, ref), so
  # switching the ref fetches fresh rather than reusing the old checkout.
  - source: github://dalklein/esphome-modbus-rtu-sniffer@v1.1.0
    components: [modbus_rtu_sniffer]
  - source:
      type: local
      path: components
    components: [solivia]      # ships with this repo

# ---------------------------------------------------------------------------
# The Delta's own '485' port.  RJ45 pin 7 = A+, pin 8 = B-.  38400 8N1 (NOT 9600
# like the RGM bus).
#
# ⚠️ Declare this uart even if you do not poll the port. The RS485 module's driver
# input sits on GPIO18; with no uart declaring that pin it floats, which can
# spuriously enable the transmitter onto a live bus. Declaring it drives the pin
# to UART idle and holds the module in receive.
uart:
  - id: uart_485
    tx_pin: GPIO18
    rx_pin: GPIO19
    baud_rate: 38400
    stop_bits: 1
    data_bits: 8
    parity: NONE
    rx_buffer_size: 512

# ---------------------------------------------------------------------------
# RGM bus, GPIO17. RECEIVE ONLY -- no tx_pin, no TX buffer.
#
# 🛑 Never transmit here. The Delta masters this bus; a second transmitter will
#    corrupt its control loop.
#
# ⚖️ NOT the same case as GPIO18 above, and the difference is worth keeping straight.
#    GPIO18 DRIVES the '485' module's driver input, so it must be declared even when
#    that port is not polled — an undriven DI can float and key the transmitter onto a
#    live bus. GPIO17 only RECEIVES: the RGM module's RO drives it, and no ESP pin
#    reaches that module's DI at all. So a config that omits this uart entirely (a
#    PV-only build with no battery to sniff) leaves GPIO17 as an unconfigured input
#    and creates NO risk to the RGM bus. Omitting the '485' uart would not be safe;
#    omitting this one is.
  - id: uart_rgm
    rx_pin: GPIO17
    baud_rate: 9600
    rx_buffer_size: 1024
    # Idle symbols that mark a message end. 10 = ~10.4 ms @9600, chosen to sit between
    # the two real limits on this bus: longer than any inter-byte gap the LG produces
    # (which exceed 3 ms), and well under the 28.3 ms minimum inter-frame idle.
    # Too short splits messages, which loses data silently -- CRC cannot see it, because
    # a fragment never becomes a frame. Too long merges a request with its reply into one
    # read, which is harmless: they are split again by declared length and CRC.
    rx_timeout: 10
    # 🔑 THE SETTING THAT MATTERS. It must exceed the longest BURST on your bus -- a
    # request and its reply arrive together whenever rx_timeout is longer than the
    # turnaround, so size against request + longest reply, not one frame.
    # Below that, the FIFO-full interrupt trips mid-burst and frames arrive merged or
    # split. Above it, bytes reach the ring buffer only at the hardware idle timeout, in
    # whole-frame units, no matter how busy the loop is. ESPHome caps this at 120 and the
    # ESP32 FIFO is 128.
    rx_full_threshold: 120


modbus_rtu_sniffer:
  id: sniff
  uart_id: uart_rgm

# ===========================================================================
# '485' PORT MASTER — the Delta's own SunSpec/Modbus-RTU slave port (addr 1)
#
# Stock ESPHome modbus + modbus_controller: this half of the dashboard is plain
# Modbus RTU FC03, so there is no reason to hand-roll it.
#
# 🔴 READ ONLY. Only `sensor` platforms are declared — no number/output/switch —
#    so nothing here can write to the inverter.
# 🔑 BUS SPACING, and nothing in this file sets it. These devices need >=95 ms between
#    requests or they start dropping replies — a property of the hardware, not of the
#    topology, and it applies per device. That floor is supplied by the `modbus` hub's
#    `turnaround_time`, which DEFAULTS TO 600 ms — six times wider than needed, and
#    measured 2026-09-19 to still let all 45 '485' sensors meet their update_interval.
#    ⚠️ `command_throttle` on the controller is INERT since 2026.8 and is removed in
#    2027.2.0. If you ever need the bus tighter, set `turnaround_time` on the hub above,
#    and never below the 95 ms floor.
# ⚠️ SunSpec values come with a separate SCALE FACTOR register (an int16 power of
#    ten). Both the raw value AND its SF are published, so the consumer applies the
#    scaling. The SFs are deliberately not assumed here.
# ===========================================================================
modbus:
  - id: mb485
    uart_id: uart_485
    role: client

modbus_controller:
  - id: delta485
    address: 1
    modbus_id: mb485
    update_interval: 10s
    setup_priority: -10

# Loop-time diagnostic. debug's loop_time reports the MAXIMUM iteration since the last
# update, not an average -- the tail is what matters on a board doing several jobs.
# Useful for seeing whether a polling component is blocking the loop.
debug:
  update_interval: 1s

sensor:
  - platform: debug
    loop_time:
      name: "RGM Loop Time"
      id: rgm_loop_time
      state_topic: "delta/rgm/sensor/loop_time/state"
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta ac current"
    id: d485_ac_a_raw
    address: 40071
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/ac_a_raw/state"
