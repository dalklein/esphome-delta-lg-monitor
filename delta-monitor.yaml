    state_topic: "delta/485/sensor/b50092/state"
  # divide by 10 for volts
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta battery bus voltage"
    id: d485_batt_bus_v
    address: 50094
    register_type: holding
    value_type: U_WORD
    state_topic: "delta/485/sensor/batt_bus_v/state"
  # SIGNED, divide by 10 for amps
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta battery bus current"
    id: d485_batt_bus_a
    address: 50095
    register_type: holding
    value_type: S_WORD
    state_topic: "delta/485/sensor/batt_bus_a/state"
  # purpose not yet identified
  - platform: modbus_controller
    modbus_controller_id: delta485
    name: "delta batt block 50096"
    id: d485_b50096
    address: 50096
