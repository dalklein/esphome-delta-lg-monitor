# ============================================================================
# Production RGM sniffer for the Delta E6 <-> LG RESU bus.
#
# ### UARTAPI VARIANT — dogfooding the proposed upstream ESPHome change ###
# Byte-for-byte the production config EXCEPT that the RGM bus goes through stock
# ESPHome `uart` + the additive read_frame() API, instead of a component that
# installs the UART driver itself. Same device name, same MQTT topics, same 70
# registers, same '485' half — so this is a drop-in replacement and any behaviour
# difference is attributable to the uart change alone.
# Fallback: `esphome upload rgm-sniffer.yaml --device <ip>` restores production.
#
#   ESP32-WROOM-32, board esp32dev, framework esp-idf
#   UART2 / GPIO17, RECEIVE ONLY  (no TX pin assigned, no TX buffer allocated:
#                                  this firmware CANNOT transmit onto the bus)
#
# Frame boundaries come from the ESP32's HARDWARE idle-detect via the UART event
# queue, not from loop timing. Proven 2026-09-09 frame-aligned and CRC-clean
# through deliberate 60 ms loop stalls; the old ESPHome modbus path framed on a
# millis() timer against a measured 24 ms loop and lost the 23-byte (213,9)
# frame carrying SOC.
#
# TOPIC SCHEME (user, 2026-09-09):
#   delta/rgm/...  this RGM-bus sniffer
#   delta/485/...  the Delta's own '485' port master, to be added on UART1
# ESPHome's topic_prefix is PER-DEVICE and both roles will share this one ESP32,
# so the prefix is plain "delta" and every topic is set EXPLICITLY - including
# birth/will/log, which would otherwise land on a bare "delta/status" and clash
# with the existing delta/inv and delta/batt namespaces.
# ============================================================================

esphome:
  # DELIBERATELY a different device name from production, so the two builds keep
  # SEPARATE .esphome/build directories. That makes rollback an instant
  #   esphome upload <fallback>.yaml --device <device-ip>
  # with no recompile. MQTT topics are all set explicitly below, so they are
  # unaffected by the name; only mDNS/OTA hostname and the MQTT client id change.
  name: delta-rgm-uartapi
  friendly_name: Delta RGM Sniffer (uart read_frame API)

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 0          # free UART0; logs go over WiFi/MQTT

wifi:
  networks:
    - ssid: !secret wifi_ssid_g
      password: !secret wifi_password
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: "Delta RGM Sniff Fallback"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_broker_ip
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: "delta"
  birth_message:
    topic: "delta/rgm/status"
    payload: "online"
  will_message:
    topic: "delta/rgm/status"
    payload: "offline"
  log_topic:
    topic: "delta/rgm/debug"
  on_disconnect:
    - logger.log: "MQTT broker unavailable, continuing to sniff."
  on_message:
    - topic: "delta/485/cmd/poll"
      then:
        - lambda: |-
            if (x == "off") id(sw_485_poll).turn_off();
            else if (x == "on") id(sw_485_poll).turn_on();

external_components:
  # The sniffer now lives in its own publishable repo -- ONE copy, no drift.
  # Switch to github://dalklein/esphome-modbus-sniffer once that repo is pushed.
  - source: github://dalklein/esphome-modbus-rtu-sniffer
    components: [modbus_rtu_sniffer]
  # uart is now STOCK ESPHome. The sniffer detects that read_frame() is unavailable and polls
  # instead, which measured identically: 0 partial frames across ~14,000 frames with 25% of
  # seconds containing a 144-161 ms loop stall. rx_full_threshold: 120 does the work.
  # Fallback with the patched uart: rgm-sniffer-readframe-fallback.yaml
  - source:
      type: local
      path: components
    components: [solivia]      # ships with this repo

# ---------------------------------------------------------------------------
# UART on GPIO18/19 -> module 2, wired to the Delta's own '485' port
#   RJ45 pin 7 = A+ , pin 8 = B-   (confirmed 2026-09-09; matches the udev note)
#
# ⚠️ DECLARED FOR SAFETY, NOT YET USED FOR POLLING.
# Module 2 is an auto-direction RS485 board: its D (driver input) is on GPIO18. With no
# uart declared, GPIO18 is an unconfigured INPUT and D FLOATS -- which can spuriously
# enable the transmitter and put noise onto the live '485' port. Declaring the uart drives
# the pin to UART idle (mark/high), holding the module in receive.
#
# 38400 8N1 is the Delta's '485' rate (NOT 9600 like the RGM bus).
# When the master role is added: pace requests at >=95-100 ms, per the pack-needs-95ms
# finding -- that limit is a property of the device, not the topology.
uart:
  - id: uart_485
    tx_pin: GPIO18
    rx_pin: GPIO19
    baud_rate: 38400
    stop_bits: 1
    data_bits: 8
    parity: NONE
    rx_buffer_size: 512

# ---------------------------------------------------------------------------
# RGM bus, GPIO17 — SAME wire, SAME framing as production, but through STOCK
# ESPHome uart plus the proposed read_frame() API instead of a component that
# owns the peripheral itself.
#
#   production:  modbus_sniffer { rx_pin, uart_num: 2, baud_rate, gap_symbols: 3 }
#   here:        uart { rx_pin, baud_rate, rx_timeout: 3, event_queue_size: 20 }
#                + modbus_sniffer_uartapi { uart_id }
#
# rx_timeout: 3 is EXACTLY production's gap_symbols: 3 — same hardware register
# (uart_set_rx_timeout), same 3.13 ms @9600, chosen between the two RTU limits.
# No tx_pin and no tx buffer: this cannot transmit onto the RGM bus.
#
# event_queue_size: 20 is the opt-in. Without it read_frame() returns false and
# supports_frame_reads() is false, i.e. stock ESPHome behaviour exactly.
#
# rx_full_threshold: see the note at the setting itself. It was RAISED TO 120 for EFFICIENCY
# (at the computed default of 8, always_rx_timeout splits each frame into 7+1 events, 2.3x the
# loop work). Correctness does not depend on it - that comes from always_rx_timeout.
  - id: uart_rgm
    rx_pin: GPIO17
    baud_rate: 9600
    rx_buffer_size: 1024
    # 10 symbols = ~10.4 ms @9600. RAISED FROM 3 on 2026-09-10 when the REAL pack replaced BE
    # on this bus. BE answered fast and tightly; the real LG has inter-byte gaps that exceed
    # 3.1 ms, so frames were being SPLIT mid-frame -- 1.5% ongoing resync and a 12% drop in
    # published messages (546/60s vs BE's 620), with crc_bad=0 throughout because a chunk that
    # is not a whole frame never becomes one and no CRC counter can see it. This is the
    # esphome#17180 mechanism on our own bus.
    # 10 sits between the two real limits: longer than any observed inter-byte gap, and well
    # under the 28.3 ms MINIMUM inter-frame idle measured on this bus.
    # Consequence: request+response (turnaround ~5.9 ms) now MERGE into one chunk. That is
    # safe -- the splitter cuts merged chunks by declared length and CRC. Splitting loses data;
    # merging does not.
    rx_timeout: 10
    # CORRECTNESS comes from uart_set_always_rx_timeout() (armed automatically when
    # event_queue_size > 0). EFFICIENCY comes from this. They are independent knobs.
    # At ESPHome's computed default (8 bytes @9600) always_rx_timeout withholds a byte on
    # the FIFO-full path, so each frame arrives as 7+1 -- measured 9632 UART events for
    # 4193 frames (2.3x), i.e. ~113 events/s vs production's ~49. That extra loop work
    # coincided with 7 modbus response timeouts on the CO-RESIDENT '485' master, which
    # production never showed. 120 = one event per frame; the FIFO is 128.
    rx_full_threshold: 120


modbus_rtu_sniffer:
  id: sniff
  uart_id: uart_rgm

# ===========================================================================
# '485' PORT MASTER — the Delta's own SunSpec/Modbus-RTU slave port (addr 1)
#
# Stock ESPHome modbus + modbus_controller: this half of the dashboard is plain
# Modbus RTU FC03, so there is no reason to hand-roll it.
#
# 🔴 READ ONLY. Only `sensor` platforms are declared — no number/output/switch —
#    so nothing here can write to the inverter.
# 🔑 command_throttle: 100ms  — the >=95 ms per-device pacing established on the
#    LG (pack-needs-95ms-between-requests). Do not lower it.
# ⚠️ SunSpec values come with a separate SCALE FACTOR register (an int16 power of
#    ten). Both raw value AND its SF are published so the consumer can scale
#    correctly; the SFs are NOT assumed here because this port has never been
#    read from this device before.
# ===========================================================================
modbus:
  - id: mb485
    uart_id: uart_485
    role: client

modbus_controller:
  - id: delta485
    address: 1
    modbus_id: mb485
    command_throttle: 100ms
    update_interval: 10s
    setup_priority: -10

# TEMPORARY, 2026-09-18: measure this device's actual loop-time TAIL.
# The question is whether millis()-based framing could work on this bus at all, given the device
# also runs the '485' master on UART1 at 38400 plus ~70 MQTT sensors. The bus's MINIMUM inter-frame
# idle is 28.3 ms, so any loop iteration longer than that would straddle a frame boundary.
# debug's loop_time publishes the MAX since the last update (see debug_component.cpp: max_loop_time_
# then reset), which is the statistic that matters -- an average would hide exactly the tail we are
# looking for. ESPHome's own "took a long time" warning only fires above 140 ms, so it cannot see
# the 28-140 ms band, which is the band in question.
debug:
  update_interval: 1s    # max loop time PER SECOND: separates the ~4 s solivia stall from the baseline

sensor:
